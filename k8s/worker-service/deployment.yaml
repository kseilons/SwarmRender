apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  labels:
    app: worker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - worker-service
              topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker-service
          image: worker-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: "/config/config.yaml"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config-volume
          configMap:
            name: app-config
            items:
              - key: worker-service.yaml
                path: config.yaml
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
