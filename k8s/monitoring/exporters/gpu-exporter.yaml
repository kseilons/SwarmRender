apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-exporter
  namespace: kube-system
  labels:
    app: gpu-exporter
spec:
  selector:
    matchLabels:
      app: gpu-exporter
  template:
    metadata:
      labels:
        app: gpu-exporter
    spec:
      containers:
        - name: gpu-exporter
          image: utkuozdemir/nvidia_gpu_exporter:1.3.1
          resources:
            limits:
              nvidia.com/gpu: 1 # Нужно хотя бы 0 или 1, чтобы K8s пробросил драйверы
          ports:
            - containerPort: 9835
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-exporter
  namespace: kube-system
spec:
  selector:
    app: gpu-exporter
  ports:
    - protocol: TCP
      port: 9835
      targetPort: 9835
