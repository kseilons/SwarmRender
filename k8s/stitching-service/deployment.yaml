apiVersion: apps/v1
kind: Deployment
metadata:
  name: stitching-service
  labels:
    app: stitching-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stitching-service
  template:
    metadata:
      labels:
        app: stitching-service
    spec:
      containers:
        - name: stitching-service
          image: stitching-service:latest
          imagePullPolicy: Never
          env:
            - name: CONFIG_PATH
              value: "/config/config.yaml"
          ports:
            - containerPort: 8082 # Port according to config
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: app-config
            items:
              - key: stitching-service.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: stitching-service
spec:
  selector:
    app: stitching-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
