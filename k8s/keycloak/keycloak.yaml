apiVersion: v1
kind: Namespace
metadata:
  name: iam

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: iam
data:
  realm-render-farm.json: |
    {
      "realm": "render-farm",
      "enabled": true,
      "registrationAllowed": true,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "loginTheme": "swarmrender",
      "clients": [
        {
          "clientId": "auth-service",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${AUTH_SERVICE_CLIENT_SECRET:-secret}",
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"]
        },
        {
          "clientId": "render-farm-frontend",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "redirectUris": ["http://localhost:5173/*", "http://swarmrender.ru/*"],
          "webOrigins": ["http://localhost:5173", "http://swarmrender.ru"],
          "attributes": { "pkce.code.challenge.method": "S256" }
        }
      ],
      "identityProviders": [
        {
          "alias": "yandex",
          "providerId": "yandex",
          "enabled": true,
          "config": {
            "clientId": "${YANDEX_CLIENT_ID}",
            "clientSecret": "${YANDEX_CLIENT_SECRET}"
          }
        },
        {
          "alias": "vk",
          "providerId": "vk",
          "enabled": true,
          "config": {
            "clientId": "${VK_CLIENT_ID}",
            "clientSecret": "${VK_CLIENT_SECRET}"
          }
        }
      ]
    }

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: iam
  labels:
    app: keycloak
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
      name: http
  selector:
    app: keycloak
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: keycloak
  namespace: iam
  name: keycloak-discovery
spec:
  selector:
    app: keycloak
  clusterIP: None
  type: ClusterIP
---
apiVersion: apps/v1
# Use a stateful setup to ensure that for a rolling update Pods are restarted with a rolling strategy one-by-one.
# This prevents losing in-memory information stored redundantly in two Pods.
kind: StatefulSet
metadata:
  name: keycloak
  namespace: iam
  labels:
    app: keycloak
spec:
  serviceName: keycloak-discovery
  # Run with one replica to save resources, or with two replicas to allow for rolling updates for configuration changes
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      namespace: iam
      labels:
        app: keycloak
    spec:
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
        - name: providers
          emptyDir: {}
      initContainers:
        - name: download-providers
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              wget -O /opt/keycloak/providers/keycloak-russian-providers.jar https://repo1.maven.org/maven2/ru/playa/keycloak/keycloak-russian-providers/26.5.0.1/keycloak-russian-providers-26.5.0.1.jar
          volumeMounts:
            - name: providers
              mountPath: /opt/keycloak/providers
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5.6
          args: ["start", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-user-pass
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-user-pass
                  key: password
            # In a production environment, add a TLS certificate to Keycloak to either end-to-end encrypt the traffic between
            # the client or Keycloak, or to encrypt the traffic between your proxy and Keycloak.
            # Respect the proxy headers forwarded by the reverse proxy
            # In a production environment, verify which proxy type you are using, and restrict access to Keycloak
            # from other sources than your proxy if you continue to use proxy headers.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            # In this explorative setup, no strict hostname is set.
            # For production environments, set a hostname for a secure setup.
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: 'KC_CACHE'
              value: 'ispn'
            # Passing the Pod's IP primary address to the JGroups clustering as this is required in IPv6 only setups
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Instruct JGroups which DNS hostname to use to discover other Keycloak nodes
            # Needs to be unique for each Keycloak cluster
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              value: '$(POD_IP)'
            - name: 'KC_DB_URL_DATABASE'
              value: 'keycloak'
            - name: 'KC_DB_URL_HOST'
              value: 'keycloak-postgres'
            - name: 'KC_DB'
              value: 'postgres'
            - name: 'KC_DB_PASSWORD'
              valueFrom:
                secretKeyRef:
                  name: keycloak-kdb-user-pass
                  key: password
            - name: 'KC_DB_USERNAME'
              valueFrom:
                secretKeyRef:
                  name: keycloak-kdb-user-pass
                  key: username
            # Данные для провайдеров
            - name: YANDEX_CLIENT_ID
              value: "aje6tkh945300npqqer2"
            - name: YANDEX_CLIENT_SECRET
              value: "yccs__c1982f5d55f2791a83e959410fc7f542a565272795f3ca6f832ab94f66df53da_02bb3314"
            - name: VK_CLIENT_ID
              value: "your-id"
            - name: VK_CLIENT_SECRET
              value: "your-secret"
          ports:
            - name: http
              containerPort: 8080
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 1
            failureThreshold: 600
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2000Mi
            requests:
              cpu: 500m
              memory: 1700Mi
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: providers
              mountPath: /opt/keycloak/providers
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-pvc
  namespace: iam
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  namespace: iam
  labels:
    app: keycloak-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      namespace: iam
      labels:
        app: keycloak-postgres
    spec:
      containers:
        - name: postgres
          image: mirror.gcr.io/postgres:17
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-kdb-user-pass
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-kdb-user-pass
                  key: password
            - name: POSTGRES_DB
              value: "keycloak"
            - name: POSTGRES_LOG_STATEMENT
              value: "all"
          ports:
            - name: k-postgres
              containerPort: 5432
          volumeMounts:
            - name: keycloak-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: keycloak-postgres-data
          persistentVolumeClaim:
            claimName: keycloak-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: keycloak-postgres
  namespace: iam
  name: keycloak-postgres
spec:
  selector:
    app: keycloak-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP