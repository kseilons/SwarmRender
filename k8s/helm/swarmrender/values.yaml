global:
  registry: "192.168.0.109:5000"
  imagePullPolicy: IfNotPresent
  domain: swarmrender.ru
  masterNodeSelector:
    node-role: master

vault:
  enabled: true
  image: hashicorp/vault:1.17
  port: 8200
  rootToken: "swarmrender-root-token"
  secretPath: "secret/swarmrender"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

secrets:
  postgres:
    user: "admin"
    password: "admin"
    db: "dev_db"
  minio:
    accessKey: "admin"
    secretKey: "password"
    bucket: "blender-renders"
  keycloak:
    adminUser: "admin"
    adminPassword: "admin"
    clientSecret: "secret"
    realm: "render-farm"

postgres:
  enabled: true
  image: mirror.gcr.io/postgres:15-alpine
  port: 5432
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

minio:
  enabled: true
  image: minio:latest
  apiPort: 9000
  consolePort: 9001
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

kafka:
  enabled: true
  image: mirror.gcr.io/apache/kafka:latest
  port: 9092
  partitions: 4
  storage: 2Gi
  topics:
    render: "render-tasks"
    metadata: "metadata-tasks"
    stitching: "stitching-tasks"
    result: "render-results"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.5.6
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

apiGateway:
  replicas: 1
  image: api-gateway:latest
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

authService:
  replicas: 1
  image: auth-service:latest
  port: 8082
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

jobService:
  replicas: 1
  image: job-service:latest
  port: 8081
  maxWorkers: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

stitchingService:
  replicas: 1
  image: stitching-service:latest
  port: 8082
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

frontend:
  replicas: 1
  image: frontend:latest
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

workerService:
  replicas: 2
  image: worker-service:latest
  blenderPath: "/opt/blender/blender"
  allowedDevices: ["CPU"]
  threads: 0
  shmSize: 2Gi
  podAntiAffinity:
    enabled: true
    topologyKey: "kubernetes.io/hostname"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.1.0
    port: 9090
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    image: mirror.gcr.io/grafana/grafana:latest
    port: 3000
    adminUser: "admin"
    adminPassword: "admin"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  nodeExporter:
    image: prom/node-exporter:v1.8.1
  kafkaExporter:
    image: danielqsj/kafka-exporter:latest
  postgresExporter:
    image: prometheuscommunity/postgres-exporter:latest
