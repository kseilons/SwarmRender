global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'job-service'
    static_configs:
      - targets: ['job-service:8081']

  - job_name: 'worker-service'
    static_configs:
      - targets: ['worker-service:8081']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8082']

  - job_name: 'stitching-service'
    static_configs:
      - targets: ['stitching-service:8081']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'gpu-exporter'
    static_configs:
      - targets: ['gpu-exporter:9835']
