apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: main-pool
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  resources:
    requests:
      memory: 1536Mi
    limits:
      memory: 2048Mi
  jvmOptions:
      "-Xms": "1024m"
      "-Xmx": "1024m"
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        class: standard
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  clusterCa:
    validityDays: 3650
    renewalDays: 30
  clientsCa:
    validityDays: 3650
  kafkaExporter:
    readinessProbe:
      initialDelaySeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 10
      timeoutSeconds: 5
    topicRegex: ".*"
    groupRegex: ".*"

  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - authentication:
          type: tls
        name: tls
        port: 9093
        tls: true
        type: internal
    authorization:
      superUsers:
        - CN=schemas-registry
        - CN=kafka-ui
      type: simple
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}