env: "local"
blender:
  path: "blender"
  allowed_devices:
    - "CPU"
    - "CUDA"
    - "OPTIX"
    # - "HIP"     # For AMD GPUs
    # - "METAL"   # For Apple Silicon
    # - "ONEAPI"  # For Intel GPUs
  threads: 0
kafka:
  brokers:
    - "swarm-kafka.ru"
  topic: "render-tasks"
  group_id: "worker-service"