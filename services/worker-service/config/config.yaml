env: "local"
blender:
  path: "blender"
  allowed_devices:
    - "CPU"
    - "CUDA"
    - "OPTIX"
    # - "HIP"     # For AMD GPUs
    # - "METAL"   # For Apple Silicon
    # - "ONEAPI"  # For Intel GPUs
  threads: 0
kafka:
  brokers:
    - "localhost:9092"
  render_topic: "render-tasks"
  metadata_topic: "metadata-tasks"
  result_topic: "render-results"
  group_id: "worker-service"

minio:
  endpoint: "localhost:9000"
  access_key: "admin"
  secret_key: "password"
  use_ssl: false
  bucket: "blender-renders"