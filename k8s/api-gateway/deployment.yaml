apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      nodeSelector:
        node-role: master
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          env:
            - name: CONFIG_PATH
              value: "/config/config.yaml"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: app-config
            items:
              - key: api-gateway.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: farm-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: swarmrender.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
