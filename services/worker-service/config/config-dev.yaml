env: "dev"
blender:
  path: "/opt/blender/blender"
  allowed_devices:
    - "CPU"
    - "CUDA"
    - "OPTIX"
  threads: 0
kafka:
  brokers:
    - "kafka:29092"
  render_topic: "render-tasks"
  metadata_topic: "metadata-tasks"
  result_topic: "render-results"
  group_id: "worker-service"

minio:
  endpoint: "minio:9000"
  access_key: "admin"
  secret_key: "password"
  use_ssl: false
  bucket: "blender-renders"
